[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
  VITE_API_URL = "/api"
  API_PROXY_TARGET = "https://laxihive.onrender.com"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
