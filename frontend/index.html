<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f8f5" />
    <script>
      (() => {
        let theme = "light";
        try {
          if (localStorage.getItem("lexi-theme") === "dark") theme = "dark";
        } catch {
          /* Browser storage is optional. */
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#0b101b" : "#f8f8f5";
      })();
    </script>
    <meta
      name="description"
      content="Train your mind. Beat your best. Discover 20 free word, memory, logic and puzzle games at LexiHive. A little sharper, every day."
    />
    <meta
      property="og:title"
      content="LexiHive — A little play. A sharper you."
    />
    <meta
      property="og:description"
      content="20 free brain games. Daily discoveries. Your next personal best."
    />
    <meta property="og:type" content="website" />
    <title>LexiHive — Train your mind. Beat your best.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
